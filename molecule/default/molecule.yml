---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: mobilizon-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        mobilizon_debug_service_enabled: false

        # Variables for Mobilizon
        mobilizon_uid: 1000
        mobilizon_gid: 1000
        mobilizon_scheme: http
        mobilizon_hostname: localhost
        mobilizon_container_labels_traefik_enabled: false
        mobilizon_container_http_host_bind_port: 4000
        mobilizon_environment_variables_secret_key_base: secret
        mobilizon_environment_variables_secret_key: secret

        # Variables required for Mobilizon to connect to the PostGIS database
        mobilizon_database_hostname: "{{ postgis_connection_hostname }}"
        mobilizon_database_port: "{{ postgis_connection_port }}"
        mobilizon_database_username: my_database_username
        mobilizon_database_password: my_database_password
        mobilizon_database_name: mobilizon
        mobilizon_systemd_required_services_list_auto: |
          {{
            (['postgis.service'])
          }}

        # Variables for Postgres
        postgis_uid: 1000
        postgis_gid: 1000
        postgis_connection_password: postgis_password
        postgis_container_network: "{{ mobilizon_container_network }}"
        postgis_managed_databases: |
          {{
            [{
              'name': mobilizon_database_name,
              'username': mobilizon_database_username,
              'password': mobilizon_database_password,
            }]
          }}
        postgis_allowed_versions_custom: [17] # Mobilizon seems to be incompatible with Postgres v18
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
scenario:
  # See: https://docs.ansible.com/projects/molecule/configuration/?h=test_sequence#scenario
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # Disable idempotence test for now due to ansible-role-postgis
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
